<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHP LOTTO - Official Links</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* 天藍色系漸層背景 */
      background: linear-gradient(180deg, #99cfff 0%, #68b0f7 50%, #4a98eb 100%);
      color: #1a365d;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* LOGO 圖片區塊 */
    .logo-wrapper {
      width: 130px;
      height: 130px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(16, 68, 133, 0.18);
      background: #ffffff;
      padding: 6px;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #0d2c54;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
      margin-bottom: 12px;
    }

    /* 按鈕容器 */
    .links-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    /* 連結按鈕樣式 */
    .link-btn {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 14px;
      color: #0c356a;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 15px rgba(22, 78, 143, 0.1);
      transition: all 0.25s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .link-btn:hover {
      background: #ffffff;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(12, 53, 106, 0.2);
      color: #0056b3;
      border-color: #ffffff;
    }

    .link-btn:active {
      transform: translateY(0);
      box-shadow: 0 3px 8px rgba(12, 53, 106, 0.15);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-wrapper">
      <img src="PHPLOGO.jpg" alt="PHP LOTTO Logo" class="logo-img">
    </div>
    
    <h1 class="title">PHP LOTTO</h1>

    <div class="links-wrapper">
      <a href="https://phplotto-signup.com/" target="_blank" rel="noopener noreferrer" class="link-btn">
        phplotto-signup.com
      </a>
      <a href="https://www.ysk3d.com" target="_blank" rel="noopener noreferrer" class="link-btn">
        www.ysk3d.com
      </a>
      <a href="https://sy.ysk3d.com" target="_blank" rel="noopener noreferrer" class="link-btn">
        sy.ysk3d.com
      </a>
      <a href="https://mc.ysk3d.com" target="_blank" rel="noopener noreferrer" class="link-btn">
        mc.ysk3d.com
      </a>
      <a href="https://ag.ysk3d.com" target="_blank" rel="noopener noreferrer" class="link-btn">
        ag.ysk3d.com
      </a>
      <a href="https://pay.ysk3d.com" target="_blank" rel="noopener noreferrer" class="link-btn">
        pay.ysk3d.com
      </a>
      <a href="https://plug.ysk3d.com" target="_blank" rel="noopener noreferrer" class="link-btn">
        plug.ysk3d.com
      </a>
    </div>
  </div>

</body>
</html>
